<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách trang web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 48px 20px;
    }
    h1 { text-align: center; font-size: 28px; margin-bottom: 32px; }
    .grid {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      padding: 24px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: transform .15s, border-color .15s, background .15s;
    }
    a.card:hover { transform: translateY(-3px); border-color: #3b82f6; background: #273449; }
    .card h2 { font-size: 20px; margin-bottom: 6px; }
    .card p { font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Danh sách trang web</h1>
  <div class="grid">
    <a class="card" href="game-vr-car.html"><h2>Game VR Car</h2><p>Game đua xe VR</p></a>
    <a class="card" href="home-iac.html"><h2>Home IAC</h2><p>Tính tổng theo Host</p></a>
    <a class="card" href="karaoke.html"><h2>Karaoke Studio</h2><p>Karaoke trên trình duyệt</p></a>
    <a class="card" href="keyboard-piano.html"><h2>Keyboard Piano</h2><p>Piano bằng bàn phím</p></a>
  </div>
</body>
</html>
