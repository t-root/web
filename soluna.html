<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Web AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      touch-action: none;
    }
    #app {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    #stage {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      transform-origin: center center;
      will-change: transform;
    }
    #video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #111;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #hud {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,0.78));
      z-index: 20;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.4;
    }
    #hud .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
    #status {
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.6);
    }
    #status.ok { color: #4ade80; }
    #status.warn { color: #fbbf24; }
    #status.err { color: #f87171; }
    #status.pred { color: #60a5fa; }
    #debug {
      margin-top: 6px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      opacity: 0.9;
      white-space: pre-wrap;
      max-height: 32vh;
      overflow: hidden;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      background: rgba(0,0,0,0.55);
      color: #fff;
      backdrop-filter: blur(8px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      pointer-events: auto;
      position: relative;
      z-index: 60;
    }
    button:active { transform: scale(0.96); }
    button.primary {
      background: rgba(255,160,40,0.9);
      color: #111;
    }
    #permission-gate {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }
    #permission-gate h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #permission-gate p {
      max-width: 320px;
      opacity: 0.8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    #permission-gate .safety {
      font-size: 0.8rem;
      opacity: 0.6;
      max-width: 300px;
    }
    #manual-loc {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: min(280px, 90vw);
    }
    #manual-loc input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #fff;
      font-size: 16px;
    }
    .hidden { display: none !important; }
    #sun-overlay, #moon-overlay {
      position: absolute;
      pointer-events: none;
      display: none;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0.95;
      box-sizing: border-box;
      will-change: left, top, width, height, filter, opacity;
      /* Cảm giác xa: soft blur nhẹ + haze */
      filter: brightness(1.06) contrast(0.96) saturate(0.88);
      box-shadow: 0 0 10px 2px rgba(255, 230, 180, 0.22);
    }
    .dir-arrow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      display: none;
      pointer-events: none;
      z-index: 5;
      font-size: 48px;
      font-weight: 700;
      line-height: 56px;
      text-align: center;
      transform-origin: center center;
    }
    #dir-arrow-sun {
      color: #ffd866;
      text-shadow: 0 0 6px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
    }
    #dir-arrow-moon {
      color: #f5f0e6;
      text-shadow: 0 0 6px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <img id="sun-overlay" alt="" draggable="false">
      <img id="moon-overlay" alt="" draggable="false">
      <div id="dir-arrow-sun" class="dir-arrow">&gt;</div>
      <div id="dir-arrow-moon" class="dir-arrow">&gt;</div>
    </div>

    <div id="hud">
      <div class="row">
        <span id="status">Chưa bắt đầu</span>
        <span id="body-flags" style="opacity:0.9;font-variant-numeric:tabular-nums;">Sun: — · Moon: —</span>
      </div>
      <div id="debug"></div>
    </div>

    <div id="permission-gate">
      <button id="btn-grant" class="primary">Cho phép Camera &amp; Vị trí</button>
      <div id="manual-loc">
        <input id="lat-input" type="number" step="any" placeholder="Vĩ độ (lat)">
        <input id="lon-input" type="number" step="any" placeholder="Kinh độ (lon)">
        <button id="btn-manual">Dùng tọa độ này</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  const deg2rad = d => d * Math.PI / 180;
  const rad2deg = r => r * 180 / Math.PI;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  function smoothAngle(prev, next, alpha) {
    let d = ((next - prev + 540) % 360) - 180;
    return (prev + d * alpha + 360) % 360;
  }

  // ============================================================
  //  Sun Ephemeris
  // ============================================================
  const SunEphemeris = {
    compute(lat, lon, date) {
      const d = date || new Date();
      const jd = this._julianDay(d);
      const T = (jd - 2451545.0) / 36525.0;

      let L0 = (280.46646 + 36000.76983 * T + 0.0003032 * T * T) % 360;
      if (L0 < 0) L0 += 360;

      let M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) % 360;
      if (M < 0) M += 360;
      const Mr = deg2rad(M);

      const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
              + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
              + 0.000289 * Math.sin(3 * Mr);

      const trueLong = L0 + C;
      const omega = 125.04 - 1934.136 * T;
      const lambda = trueLong - 0.00569 - 0.00478 * Math.sin(deg2rad(omega));

      const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
      const eps = eps0 + 0.00256 * Math.cos(deg2rad(omega));

      const lambdaR = deg2rad(lambda);
      const epsR = deg2rad(eps);

      let ra = Math.atan2(Math.cos(epsR) * Math.sin(lambdaR), Math.cos(lambdaR));
      const dec = Math.asin(Math.sin(epsR) * Math.sin(lambdaR));
      ra = rad2deg(ra);
      if (ra < 0) ra += 360;

      const gmst = this._gmst(jd);
      let lst = (gmst + lon) % 360;
      if (lst < 0) lst += 360;

      let ha = (lst - ra + 360) % 360;
      if (ha > 180) ha -= 360;
      const haR = deg2rad(ha);
      const latR = deg2rad(lat);
      const decR = dec;

      const sinAlt = Math.sin(latR) * Math.sin(decR) + Math.cos(latR) * Math.cos(decR) * Math.cos(haR);
      let alt = rad2deg(Math.asin(clamp(sinAlt, -1, 1)));

      const cosAz = (Math.sin(decR) - Math.sin(latR) * Math.sin(deg2rad(alt))) /
                    (Math.cos(latR) * Math.cos(deg2rad(alt)));
      let az = rad2deg(Math.acos(clamp(cosAz, -1, 1)));
      if (Math.sin(haR) > 0) az = 360 - az;

      if (alt > -0.575) {
        const R = 1.02 / Math.tan(deg2rad(alt + 10.3 / (alt + 5.11))) / 60;
        alt += R;
      }

      return { azimuth: az, altitude: alt };
    },

    _julianDay(d) {
      const y = d.getUTCFullYear();
      const m = d.getUTCMonth() + 1;
      const day = d.getUTCDate() +
        (d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600) / 24;
      let Y = y, M = m;
      if (M <= 2) { Y -= 1; M += 12; }
      const A = Math.floor(Y / 100);
      const B = 2 - A + Math.floor(A / 4);
      return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + day + B - 1524.5;
    },

    _gmst(jd) {
      const T = (jd - 2451545.0) / 36525.0;
      let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
               + 0.000387933 * T * T - T * T * T / 38710000;
      gmst = gmst % 360;
      if (gmst < 0) gmst += 360;
      return gmst;
    }
  };

  // ============================================================
  //  Camera
  // ============================================================
  const CameraManager = {
    stream: null,
    video: null,

    async start(videoEl) {
      this.video = videoEl;
      if (this.stream) this.stop();
      try {
        this.stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
      } catch (e) {
        this.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
      videoEl.srcObject = this.stream;
      await videoEl.play();
      return true;
    },

    stop() {
      if (this.stream) {
        this.stream.getTracks().forEach(t => t.stop());
        this.stream = null;
      }
      if (this.video) this.video.srcObject = null;
    },

    getSize() {
      if (!this.video) return { w: 0, h: 0 };
      return {
        w: this.video.videoWidth || this.video.clientWidth,
        h: this.video.videoHeight || this.video.clientHeight
      };
    }
  };

  // ============================================================
  //  Location
  // ============================================================
  const LocationTime = {
    lat: null, lon: null, accuracy: null, source: null,

    async request() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocation không được hỗ trợ'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          pos => {
            this.lat = pos.coords.latitude;
            this.lon = pos.coords.longitude;
            this.accuracy = pos.coords.accuracy;
            this.source = 'gps';
            resolve(this);
          },
          err => reject(err),
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
        );
      });
    },

    setManual(lat, lon) {
      this.lat = lat; this.lon = lon; this.accuracy = null; this.source = 'manual';
    },

    now() { return new Date(); }
  };

  // ============================================================
  //  Moon ephemeris (Meeus, chuỗi rút gọn, sai số ~0.3°) + chế độ ban đêm
  // ============================================================
  const MoonEphemeris = {
    compute(lat, lon, date) {
      const d = date || new Date();
      const jd = SunEphemeris._julianDay(d);
      const T = (jd - 2451545.0) / 36525.0;
      const sin = (x) => Math.sin(deg2rad(x));
      const cos = (x) => Math.cos(deg2rad(x));

      const Lp = 218.3164477 + 481267.88123421 * T;
      const D  = 297.8501921 + 445267.1114034 * T;
      const M  = 357.5291092 + 35999.0502909 * T;
      const Mp = 134.9633964 + 477198.8675055 * T;
      const F  = 93.2720950 + 483202.0175233 * T;

      const lam = Lp
        + 6.289 * sin(Mp) + 1.274 * sin(2 * D - Mp) + 0.658 * sin(2 * D)
        + 0.214 * sin(2 * Mp) - 0.186 * sin(M) - 0.114 * sin(2 * F)
        + 0.059 * sin(2 * D - 2 * Mp) + 0.057 * sin(2 * D - M - Mp)
        + 0.053 * sin(2 * D + Mp) + 0.046 * sin(2 * D - M)
        + 0.041 * sin(Mp - M) - 0.035 * sin(D) - 0.030 * sin(M + Mp);
      const bet = 5.128 * sin(F) + 0.281 * sin(Mp + F) + 0.278 * sin(Mp - F)
        + 0.173 * sin(2 * D - F) + 0.055 * sin(2 * D - Mp + F) + 0.046 * sin(2 * D - Mp - F)
        + 0.033 * sin(2 * D + F);
      const distKm = 385001 - 20905 * cos(Mp) - 3699 * cos(2 * D - Mp)
        - 2956 * cos(2 * D) - 570 * cos(2 * Mp);
      const parallax = rad2deg(Math.asin(6378.14 / distKm));

      const eps = 23.439291 - 0.0130042 * T;
      const ra = (rad2deg(Math.atan2(
        sin(lam) * cos(eps) - Math.tan(deg2rad(bet)) * sin(eps), cos(lam))) + 360) % 360;
      const dec = Math.asin(sin(bet) * cos(eps) + cos(bet) * sin(eps) * sin(lam));

      const lst = (SunEphemeris._gmst(jd) + lon + 360) % 360;
      const H = deg2rad(lst - ra);
      const phi = deg2rad(lat);

      const sinAlt = Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H);
      let alt = rad2deg(Math.asin(clamp(sinAlt, -1, 1)));
      // Từ phía Nam → quy về từ phía Bắc
      let az = rad2deg(Math.atan2(Math.sin(H),
        Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi))) + 180;
      az = (az % 360 + 360) % 360;

      // Thị sai (Mặt Trăng gần nên ~1°) rồi khúc xạ
      alt -= parallax * Math.cos(deg2rad(alt));
      if (alt > -0.575) {
        const R = 1.02 / Math.tan(deg2rad(alt + 10.3 / (alt + 5.11))) / 60;
        alt += R;
      }
      return { azimuth: az, altitude: alt };
    }
  };

  // ============================================================
  //  Sensors
  // ============================================================
  const SensorManager = {
    alpha: null, beta: null, gamma: null,
    absolute: false,
    supported: false,
    needsPermission: false,
    lastUpdate: 0,
    heading: null,
    pitch: null,
    roll: null,
    horizonRoll: 0,
    sHeading: null,
    sPitch: null,
    sRoll: null,
    sHorizonRoll: 0,
    // Lớn hơn = bám cảm biến sát hơn (ít trễ khi xoay máy), đổi lại rung hơn một chút
    alphaSmooth: 0.55,
    // Look vector already is the rear camera direction → no offset by default
    headingOffset: 0,
    gotAbsEvent: false,
    iosYaw: null,
    pitchOffset: 0,
    screenAngle: 0,

    init() {
      this.supported = 'DeviceOrientationEvent' in window;
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        this.needsPermission = true;
      }
      try {
        // Offset cũ (đặc biệt offset ~180/336°) làm lệch nặng → reset một lần
        if (localStorage.getItem('sunar_v') !== '4') {
          localStorage.removeItem('sunar_ho');
          localStorage.removeItem('sunar_po');
          localStorage.setItem('sunar_v', '4');
        }
        const ho = localStorage.getItem('sunar_ho');
        const po = localStorage.getItem('sunar_po');
        if (ho != null) {
          const v = parseFloat(ho);
          // Bỏ offset vô lý (gần 180° thường do lật heading nhầm)
          if (!isNaN(v) && Math.abs(((v + 180) % 360) - 180) < 150) this.headingOffset = v;
        }
        if (po != null) this.pitchOffset = parseFloat(po);
      } catch (e) {}
      this._updateScreenAngle();
      window.addEventListener('orientationchange', () => {
        setTimeout(() => this._updateScreenAngle(), 100);
      });
      if (screen.orientation) {
        screen.orientation.addEventListener('change', () => this._updateScreenAngle());
      }
    },

    _updateScreenAngle() {
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        this.screenAngle = screen.orientation.angle;
      } else if (typeof window.orientation === 'number') {
        this.screenAngle = window.orientation;
      } else {
        // Fallback from aspect: not ideal but better than nothing
        this.screenAngle = (window.innerWidth > window.innerHeight) ? 90 : 0;
      }
    },

    async requestPermission() {
      if (this.needsPermission) {
        try {
          const r = await DeviceOrientationEvent.requestPermission();
          return r === 'granted';
        } catch (e) { return false; }
      }
      return true;
    },

    start() {
      if (!this.supported) return false;
      window.addEventListener('deviceorientationabsolute', this._onOrient, true);
      window.addEventListener('deviceorientation', this._onOrient, true);
      return true;
    },

    stop() {
      window.removeEventListener('deviceorientationabsolute', this._onOrient, true);
      window.removeEventListener('deviceorientation', this._onOrient, true);
    },

    /**
     * Convert deviceorientation + screen angle → camera look heading/pitch
     * and the horizon tilt in the camera image (for gravity-upright text).
     */
    _attitudeFromEuler(alphaDeg, betaDeg, gammaDeg, screenAngleDeg) {
      const a = deg2rad(alphaDeg || 0);
      const b = deg2rad(betaDeg || 0);
      const g = deg2rad(gammaDeg || 0);
      const o = deg2rad(screenAngleDeg || 0);

      const ca = Math.cos(a), sa = Math.sin(a);
      const cb = Math.cos(b), sb = Math.sin(b);
      const cg = Math.cos(g), sg = Math.sin(g);

      // Rear-camera look vector in world (X east, Y north, Z up)
      // = -Z axis of the device (W3C Z-X'-Y'' rotation matrix, 3rd column negated)
      let vx = -(ca * sg + sa * sb * cg);
      let vy = -(sa * sg - ca * sb * cg);
      let vz = -(cb * cg);

      const co = Math.cos(-o), so = Math.sin(-o);
      const rx = vx * co - vy * so;
      const ry = vx * so + vy * co;
      const rz = vz;

      let heading = rad2deg(Math.atan2(rx, ry));
      heading = (heading + 360) % 360;

      const horiz = Math.sqrt(rx * rx + ry * ry);
      let pitch = rad2deg(Math.atan2(rz, horiz));

      // --- Text parallel to true horizon (CSS rotate deg) ---
      // When viewing the sky, the horizon line in the camera image tilts with
      // the phone's side-tilt. Use screen-orientation-aware roll so "Tr  ng"
      // stays level with the real horizon.
      const scrAng = ((screenAngleDeg % 360) + 360) % 360;
      let horizonRoll;
      const gx = Math.sin(g);
      const gy = -Math.cos(g) * Math.sin(b);
      const faceRoll = rad2deg(Math.atan2(gx, gy));

      if (scrAng === 0) {
        horizonRoll = -gammaDeg;
        if (Math.abs(betaDeg - 90) > 25) horizonRoll = -faceRoll;
      } else if (scrAng === 90) {
        horizonRoll = -(betaDeg - 90);
      } else if (scrAng === 180) {
        horizonRoll = gammaDeg;
      } else if (scrAng === 270) {
        horizonRoll = betaDeg - 90;
      } else {
        horizonRoll = -(faceRoll - scrAng);
      }
      horizonRoll = ((horizonRoll + 540) % 360) - 180;

      return { heading, pitch, roll: gammaDeg, horizonRoll };
    },

    _onOrient: function (e) {
      if (e.absolute === true || e.type === 'deviceorientationabsolute') {
        SensorManager.absolute = true;
      }
      if (e.alpha == null && e.beta == null && e.gamma == null) return;

      // Android Chrome: 'deviceorientation' alpha is relative (arbitrary zero),
      // so once the absolute event is firing, ignore the relative one.
      if (e.type === 'deviceorientationabsolute') SensorManager.gotAbsEvent = true;
      if (e.type === 'deviceorientation' && !e.absolute && SensorManager.gotAbsEvent &&
          typeof e.webkitCompassHeading !== 'number') {
        return;
      }

      SensorManager.alpha = e.alpha;
      SensorManager.beta = e.beta;
      SensorManager.gamma = e.gamma;
      SensorManager.lastUpdate = performance.now();
      SensorManager._updateScreenAngle();

      let alpha = e.alpha;
      const isIOS = typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading);
      if (isIOS) SensorManager.absolute = true;

      if ((alpha == null && !isIOS) || e.beta == null) return;

      let att;
      if (isIOS) {
        // iOS: alpha là góc TƯƠNG ĐỐI (gốc tuỳ ý). Tính hướng nhìn bằng alpha tương đối,
        // rồi căn lệch (yaw) theo la bàn webkitCompassHeading khi máy dựng đứng
        // (lúc đó la bàn = hướng camera sau). Khi ngửa lên trời la bàn không tin được
        // nên dùng yaw đã học, giữ bằng gyro.
        att = SensorManager._attitudeFromEuler(
          alpha || 0, e.beta, e.gamma != null ? e.gamma : 0, SensorManager.screenAngle
        );
        const upright = e.beta > 55 && e.beta < 125;
        if (upright) {
          const diff = ((e.webkitCompassHeading - att.heading + 540) % 360) - 180;
          if (SensorManager.iosYaw == null) SensorManager.iosYaw = diff;
          else SensorManager.iosYaw += (((diff - SensorManager.iosYaw + 540) % 360) - 180) * 0.05;
        }
        if (SensorManager.iosYaw != null) {
          att.heading = (att.heading + SensorManager.iosYaw + 360) % 360;
        } else {
          // Chưa có mẫu dựng đứng → tạm dùng la bàn thô
          att = SensorManager._attitudeFromEuler(
            (360 - e.webkitCompassHeading) % 360, e.beta,
            e.gamma != null ? e.gamma : 0, SensorManager.screenAngle
          );
        }
      } else {
        att = SensorManager._attitudeFromEuler(
          alpha, e.beta, e.gamma != null ? e.gamma : 0, SensorManager.screenAngle
        );
      }

      let heading = (att.heading + SensorManager.headingOffset + 360) % 360;
      let pitch = att.pitch + SensorManager.pitchOffset;
      pitch = clamp(pitch, -89, 89);
      let roll = att.roll != null ? att.roll : 0;
      let horizonRoll = att.horizonRoll != null ? att.horizonRoll : 0;

      SensorManager.heading = heading;
      SensorManager.pitch = pitch;
      SensorManager.roll = roll;
      SensorManager.horizonRoll = horizonRoll;

      if (SensorManager.sHeading == null) {
        SensorManager.sHeading = heading;
        SensorManager.sPitch = pitch;
        SensorManager.sRoll = roll;
        SensorManager.sHorizonRoll = horizonRoll;
      } else {
        SensorManager.sHeading = smoothAngle(SensorManager.sHeading, heading, SensorManager.alphaSmooth);
        SensorManager.sPitch = lerp(SensorManager.sPitch, pitch, SensorManager.alphaSmooth);
        SensorManager.sRoll = lerp(SensorManager.sRoll, roll, SensorManager.alphaSmooth);
        // Faster tracking so text stays locked to horizon while tilting
        SensorManager.sHorizonRoll = lerp(
          SensorManager.sHorizonRoll != null ? SensorManager.sHorizonRoll : horizonRoll,
          horizonRoll,
          0.45
        );
      }
    }.bind(this),

    isFresh(maxAgeMs = 2000) {
      return this.lastUpdate > 0 && (performance.now() - this.lastUpdate) < maxAgeMs;
    }
  };

  // ============================================================
  //  Projection
  // ============================================================
  const Projection = {
    // Physical camera horizontal FOV (along sensor width), degrees
    camHFovDeg: 70,
    // Screen-mapped FOVs (recomputed on resize / orientation)
    screenHFovDeg: 65,
    screenVFovDeg: 50,

    estimateFromVideo(videoW, videoH) {
      if (!videoW || !videoH) return;
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      // object-fit: cover → visible crop of the video
      const videoAspect = videoW / videoH;
      const screenAspect = screenW / screenH;

      // camHFovDeg là FOV theo CẠNH DÀI của cảm biến. Video dọc (portrait) thì cạnh dài
      // là chiều cao → trước đây gán nhầm cho chiều rộng làm FOV dọc bị phình (~97°).
      const longSide = Math.max(videoW, videoH);
      const tL = Math.tan(deg2rad(this.camHFovDeg / 2));
      const camH = 2 * rad2deg(Math.atan(tL * videoW / longSide));
      const camV = 2 * rad2deg(Math.atan(tL * videoH / longSide));

      if (screenAspect > videoAspect) {
        // Screen wider than video → letterbox crop top/bottom; full video width visible
        this.screenHFovDeg = camH;
        const visibleVFraction = videoAspect / screenAspect;
        this.screenVFovDeg = 2 * rad2deg(Math.atan(Math.tan(deg2rad(camV / 2)) * visibleVFraction));
      } else {
        // Screen taller → crop sides; full video height visible
        this.screenVFovDeg = camV;
        const visibleHFraction = screenAspect / videoAspect;
        this.screenHFovDeg = 2 * rad2deg(Math.atan(Math.tan(deg2rad(camH / 2)) * visibleHFraction));
      }
    },

    project(dAz, dAlt) {
      const hFov = this.screenHFovDeg || 65;
      const vFov = this.screenVFovDeg || 50;
      // Chiếu phối cảnh (rectilinear) thay vì tuyến tính → chính xác hơn khi xa tâm
      const tH = Math.tan(deg2rad(hFov / 2));
      const tV = Math.tan(deg2rad(vFov / 2));
      const fx = Math.abs(dAz) < 89 ? Math.tan(deg2rad(dAz)) / (2 * tH) : Math.sign(dAz) * 1e3;
      const fy = Math.abs(dAlt) < 89 ? Math.tan(deg2rad(dAlt)) / (2 * tV) : Math.sign(dAlt) * 1e3;
      const nx = 0.5 + fx;
      const ny = 0.5 - fy;
      return { nx, ny, inFrame: nx >= -0.05 && nx <= 1.05 && ny >= -0.05 && ny <= 1.05 };
    },

    // Legacy alias used by angular sun size
    get hFovDeg() { return this.screenHFovDeg || this.camHFovDeg; }
  };

  // ============================================================
  //  SkyCheck — heuristic trong nhà / ngoài trời (xem có bầu trời không)
  // ============================================================
  const SkyCheck = {
    enabled: true,
    outdoor: null,      // null = chưa biết
    frac: 0,            // tỉ lệ pixel giống bầu trời (đã làm mượt)
    canvas: null,
    ctx: null,
    lastTs: 0,
    W: 64,

    init() {
      this.canvas = document.createElement('canvas');
      this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
      try {
        if (localStorage.getItem('sunar_sky') === '0') this.enabled = false;
      } catch (e) {}
    },

    // Màu giống trời: xanh, hoặc trắng/xám rất sáng (mây, quầng sáng, cháy sáng)
    isSkyColor(r, g, b) {
      const br = (r + g + b) / 3;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (b >= r * 1.05 && b >= g * 0.95 && br > 95) return true;      // trời xanh
      if (br >= 195 && mx - mn < 60) return true;                      // mây / cháy sáng
      return false;
    },

    update(video) {
      const now = performance.now();
      if (!this.enabled) { this.outdoor = null; return; }
      if (now - this.lastTs < 330) return;           // ~3 lần/giây
      if (!video || video.readyState < 2 || !video.videoWidth) return;
      this.lastTs = now;

      const w = this.W;
      const h = Math.max(8, Math.round(w * video.videoHeight / video.videoWidth));
      this.canvas.width = w;
      this.canvas.height = h;
      this.ctx.drawImage(video, 0, 0, w, h);
      let d;
      try { d = this.ctx.getImageData(0, 0, w, h).data; } catch (e) { return; }

      let sky = 0, total = 0;
      for (let y = 0; y < h - 1; y++) {
        for (let x = 0; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          const r = d[i], g = d[i + 1], b = d[i + 2];
          total++;
          if (!this.isSkyColor(r, g, b)) continue;
          // Ít chi tiết (trời mượt) — tường/đồ vật có nhiều cạnh
          const br = (r + g + b) / 3;
          const bx = (d[i + 4] + d[i + 5] + d[i + 6]) / 3;
          const by = (d[i + w * 4] + d[i + w * 4 + 1] + d[i + w * 4 + 2]) / 3;
          if (Math.abs(br - bx) + Math.abs(br - by) < 22) sky++;
        }
      }
      const f = total ? sky / total : 0;
      this.frac = this.frac * 0.6 + f * 0.4;
      // Hysteresis để khỏi chớp
      if (this.outdoor !== true && this.frac > 0.22) this.outdoor = true;
      else if (this.outdoor !== false && this.frac < 0.10) this.outdoor = false;
      else if (this.outdoor == null) this.outdoor = this.frac >= 0.16;
    }
  };

  // ============================================================
  //  AutoCal — tự hiệu chỉnh heading/pitch offset khi nhận diện chắc chắn
  // ============================================================
  const AutoCal = {
    enabled: true,
    streak: 0,
    lastSave: 0,

    _apply(dHead, dPitch) {
      SensorManager.headingOffset = ((SensorManager.headingOffset + dHead) % 360 + 360) % 360;
      SensorManager.pitchOffset = clamp(SensorManager.pitchOffset + dPitch, -45, 45);
      // Cho giá trị đã làm mượt nhảy theo ngay để khỏi phải chờ
      if (SensorManager.sHeading != null) SensorManager.sHeading = (SensorManager.sHeading + dHead + 360) % 360;
      if (SensorManager.sPitch != null) SensorManager.sPitch = clamp(SensorManager.sPitch + dPitch, -89, 89);
      const now = performance.now();
      if (now - this.lastSave > 3000) {
        this.lastSave = now;
        try {
          localStorage.setItem('sunar_ho', String(SensorManager.headingOffset));
          localStorage.setItem('sunar_po', String(SensorManager.pitchOffset));
        } catch (e) {}
      }
    },

    // det/pred: toạ độ chuẩn hoá 0..1 trên màn hình
    // Cho phép lệch lớn hơn để kéo offset khi pitch/heading sai nhiều
    feed(detNx, detNy, predNx, predNy) {
      if (!this.enabled) return;
      const ex = predNx - detNx, ey = detNy - predNy;
      const err = Math.hypot(ex, ey);
      if (err > 0.42) { this.streak = 0; return; }
      if (++this.streak < 3) return;
      const gain = err > 0.18 ? 0.28 : 0.14;
      const limH = err > 0.18 ? 4.0 : 1.8;
      const limV = err > 0.18 ? 4.0 : 1.8;
      const step = (v, lim) => clamp(v * gain, -lim, lim);
      this._apply(
        step(ex * (Projection.screenHFovDeg || 65), limH),
        step(ey * (Projection.screenVFovDeg || 50), limV)
      );
    },

    // Người dùng chạm đúng Mặt Trời → áp toàn bộ sai lệch
    tap(tapNx, tapNy, predNx, predNy) {
      this._apply(
        (predNx - tapNx) * (Projection.screenHFovDeg || 65),
        (tapNy - predNy) * (Projection.screenVFovDeg || 50)
      );
      this.lastSave = 0;
    }
  };

  // ============================================================
  //  Sun image detector — handles overexposed white sun
  // ============================================================
  const SunDetector = {
    canvas: null,
    ctx: null,
    processW: 160,
    moon: false,          // true = ban đêm, tìm Mặt Trăng (sáng vừa, nền tối)
    lastResult: null,
    lastTs: 0,

    init() {
      this.canvas = document.createElement('canvas');
      this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    },

    // predNx/predNy use unzoomed screen coordinates; zoom maps them into the crop.
    detect(video, predNx, predNy, zoom) {
      if (!video || video.readyState < 2) return null;
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const zoomFactor = Math.max(1, Number.isFinite(zoom) ? zoom : 1);
      const coverScale = Math.max(window.innerWidth / vw, window.innerHeight / vh);
      const visibleW = window.innerWidth / coverScale;
      const visibleH = window.innerHeight / coverScale;
      const sourceW = Math.min(vw, visibleW / zoomFactor);
      const sourceH = Math.min(vh, visibleH / zoomFactor);
      const sourceX = (vw - sourceW) / 2;
      const sourceY = (vh - sourceH) / 2;
      const pw = this.processW;
      const ph = Math.max(8, Math.round(pw * (sourceH / sourceW)));
      this.canvas.width = pw;
      this.canvas.height = ph;
      this.ctx.drawImage(video, sourceX, sourceY, sourceW, sourceH, 0, 0, pw, ph);

      let data;
      try {
        data = this.ctx.getImageData(0, 0, pw, ph).data;
      } catch (e) {
        return null;
      }

      let maxB = 0;
      for (let i = 0; i < data.length; i += 4) {
        const b = (data[i] + data[i + 1] + data[i + 2]) / 3;
        if (b > maxB) maxB = b;
      }

      // Overexposed sun → near white. Adaptive threshold.
      const thr = this.moon ? Math.max(110, maxB * 0.8) : Math.max(175, maxB * 0.82);

      // Scan around the predicted point, but never outside the visible zoom crop.
      let x0 = 0, x1 = pw, y0 = 0, y1 = ph;
      const cropPredNx = predNx == null ? null : 0.5 + (predNx - 0.5) * zoomFactor;
      const cropPredNy = predNy == null ? null : 0.5 + (predNy - 0.5) * zoomFactor;
      let hasPred = predNx != null && predNy != null &&
        cropPredNx >= -0.15 && cropPredNx <= 1.15 &&
        cropPredNy >= -0.15 && cropPredNy <= 1.15;
      if (hasPred) {
        const cx0 = cropPredNx * pw;
        const cy0 = cropPredNy * ph;
        // ~55% khung — đủ rộng để bắt được khi lệch vài chục độ
        const rad = Math.max(pw, ph) * 0.55;
        x0 = Math.max(0, Math.floor(cx0 - rad));
        x1 = Math.min(pw, Math.ceil(cx0 + rad));
        y0 = Math.max(0, Math.floor(cy0 - rad));
        y1 = Math.min(ph, Math.ceil(cy0 + rad));
      }

      // Gom các pixel sáng thành từng đốm riêng (flood fill) rồi chọn đốm đúng nhất.
      // Trước đây lấy trung bình mọi pixel sáng → trăng + đèn + mép nhà bị trộn, lệch tâm.
      const mask = new Uint8Array(pw * ph);
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const i = (y * pw + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          if ((r + g + b) / 3 < thr) continue;
          if (this.moon) {
            // Mặt Trăng: trắng / xám / hơi vàng, ít bão hoà màu
            if (Math.max(r, g, b) - Math.min(r, g, b) > 70) continue;
          } else {
            const nearWhite = r > 230 && g > 220 && b > 200;
            const warm = r >= g * 0.9 && r >= b * 0.75;
            if (!nearWhite && !warm) continue;
          }
          mask[y * pw + x] = 1;
        }
      }

      let best = null;
      const stack = [];
      for (let sy = y0; sy < y1; sy++) {
        for (let sx = x0; sx < x1; sx++) {
          if (mask[sy * pw + sx] !== 1) continue;
          const c = { n: 0, sx: 0, sy: 0, sr: 0, sg: 0, sb: 0, minX: 1e9, maxX: -1, minY: 1e9, maxY: -1 };
          stack.length = 0;
          stack.push(sx, sy);
          mask[sy * pw + sx] = 2;
          while (stack.length) {
            const y = stack.pop(), x = stack.pop();
            const i = (y * pw + x) * 4;
            c.n++; c.sx += x; c.sy += y;
            c.sr += data[i]; c.sg += data[i + 1]; c.sb += data[i + 2];
            if (x < c.minX) c.minX = x;
            if (x > c.maxX) c.maxX = x;
            if (y < c.minY) c.minY = y;
            if (y > c.maxY) c.maxY = y;
            for (let k = 0; k < 4; k++) {
              const nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0);
              const ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
              if (nx < x0 || nx >= x1 || ny < y0 || ny >= y1) continue;
              if (mask[ny * pw + nx] !== 1) continue;
              mask[ny * pw + nx] = 2;
              stack.push(nx, ny);
            }
          }
          // Bỏ đốm quá nhỏ (phản xạ, mép sáng trong nhà)
          if (c.n < 8) continue;

          const ccx = sourceX + (c.sx / c.n) * (sourceW / pw);
          const ccy = sourceY + (c.sy / c.n) * (sourceH / ph);
          const ar = c.n / (pw * ph);
          let sc = maxB / 255;
          // Mặt Trời cháy sáng thường chiếm diện tích lớn trên canvas nhỏ → không phạt nặng
          if (ar > 0.0008 && ar < 0.18) sc += 0.25;
          else if (ar >= 0.18) sc -= 0.15;
          else sc -= 0.25;

          let d = 0;
          if (hasPred) {
            const dx = (ccx - sourceX) / sourceW - cropPredNx;
            const dy = (ccy - sourceY) / sourceH - cropPredNy;
            d = Math.sqrt(dx * dx + dy * dy);
            // Cho phép lệch xa hơn để còn tự hiệu chỉnh khi heading/pitch offset sai
            if (d > 0.70) continue;
            sc += (0.70 - d) * 0.7;
          } else {
            if (ar > 0.12 || maxB < 240) continue;
            sc *= 0.5;
          }
          const ver = this._verify(data, pw, ph, c.n, c.sx / c.n, c.sy / c.n,
            c.minX, c.maxX, c.minY, c.maxY, (c.sr + c.sg + c.sb) / (3 * c.n));
          // Overexposed sun lớn: vòng quanh vẫn sáng → verified hay fail; chỉ phạt nhẹ
          if (!ver) {
            const largeBright = !this.moon && c.n >= 40 && maxB >= 230;
            sc *= largeBright ? 0.72 : 0.35;
          }
          // Ưu tiên đốm gần dự đoán và đủ lớn hơn là điểm sáng lẻ tẻ
          const rank = sc + Math.min(c.n, 40) / 400;
          if (!best || rank > best.rank) {
            best = { c, cx: ccx, cy: ccy, ar, score: sc, dist: d, verified: ver, rank };
          }
        }
      }

      if (!best) {
        this.lastResult = null;
        return null;
      }
      const count = best.c.n;
      const sumR = best.c.sr, sumG = best.c.sg, sumB = best.c.sb;
      const cx = best.cx, cy = best.cy;
      const areaRatio = best.ar;
      const dist = best.dist;
      const verified = best.verified;
      let score = best.score;

      const confidence = clamp(score, 0, 1);
      const avgColor = {
        r: Math.round(sumR / count),
        g: Math.round(sumG / count),
        b: Math.round(sumB / count)
      };

      // Blob radius in video pixels (treat bright area as approximate disk)
      const pixelArea = count * (sourceW / pw) * (sourceH / ph);
      const radiusPx = Math.sqrt(Math.max(pixelArea, 1) / Math.PI);

      const result = {
        x: cx, y: cy, score, confidence, maxB, areaRatio, avgColor, dist, verified,
        radiusPx
      };
      this.lastResult = result;
      this.lastTs = performance.now();
      return result;
    },

    isFresh(maxAge = 500) {
      return this.lastResult && (performance.now() - this.lastTs) < maxAge;
    },

    _verify(data, pw, ph, count, cx, cy, minX, maxX, minY, maxY, blobBr) {
      // 0) Quá nhỏ → phản xạ / đốm đèn trong nhà, không phải thiên thể
      if (count < 8) return false;
      const r = Math.sqrt(Math.max(count, 1) / Math.PI);
      if (r < 1.8) return false;

      // 1) Hình dạng: đĩa tròn → bbox gần vuông và lấp đầy
      if (count >= 12) {
        const bw = maxX - minX + 1, bh = maxY - minY + 1;
        const aspect = bw / bh;
        const fill = count / (bw * bh);
        if (aspect > 1.8 || aspect < 0.55 || fill < 0.5) return false;
      }
      // 2) Vòng quanh điểm sáng
      // Mặt Trời cháy sáng: halo rộng → lấy vòng xa hơn và chấp nhận pixel sáng vừa
      const ring = this.moon ? (r * 2.5 + 3) : (r * 3.2 + 4);
      let ok = 0, n = 0, darkN = 0;
      for (let k = 0; k < 16; k++) {
        const a = (k / 16) * Math.PI * 2;
        const x = Math.round(cx + Math.cos(a) * ring);
        const y = Math.round(cy + Math.sin(a) * ring);
        if (x < 0 || y < 0 || x >= pw || y >= ph) continue;
        const i = (y * pw + x) * 4;
        n++;
        const br = (data[i] + data[i + 1] + data[i + 2]) / 3;
        if (this.moon) {
          // Ban đêm: quanh Mặt Trăng phải tối (tường/đồ trong nhà thường sáng)
          if (br < 90 || br < blobBr * 0.45) { ok++; darkN++; }
        } else if (SkyCheck.isSkyColor(data[i], data[i + 1], data[i + 2]) || br > 160) {
          // Chấp nhận cả vùng sáng halo / mây quanh Mặt Trời
          ok++;
        }
      }
      if (n >= 4 && ok / n < 0.4) return false;
      if (this.moon && n >= 4 && darkN / n < 0.45) return false;
      return true;
    }
  };

  // ============================================================
  //  Model detector (YOLOv8 ONNX, class 0 = moon, 1 = sun) — ưu tiên hơn SunDetector
  // ============================================================
  const ModelDetector = {
    modelUrl: 'https://raw.githubusercontent.com/t-root/droply/refs/heads/main/soluna-model.onnx',
    ortBase: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/',
    size: 320,
    minScore: 0.35,
    session: null,
    state: 'idle',          // idle | loading | ready | failed
    busy: false,
    canvas: null,
    ctx: null,
    results: { sun: null, moon: null },
    lastTs: 0,
    info: '',
    holdScore: 0.2,         // ngưỡng giữ khi đã đang bám
    hitTs: [0, 0],
    keep: [null, null],

    // Trả về promise hoàn tất khi model tải xong (ready) hoặc lỗi (failed)
    load() {
      if (!this._promise) this._promise = this._load();
      return this._promise;
    },

    async _load() {
      this.state = 'loading';
      try {
        this.canvas = document.createElement('canvas');
        this.canvas.width = this.canvas.height = this.size;
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
        // Thu nhỏ 1280x720 → 320 cần lọc chất lượng cao, tránh răng cưa làm model mất nhạy
        this.ctx.imageSmoothingEnabled = true;
        this.ctx.imageSmoothingQuality = 'high';

        await new Promise((resolve, reject) => {
          const sc = document.createElement('script');
          sc.src = this.ortBase + 'ort.all.min.js';
          sc.onload = resolve;
          sc.onerror = () => reject(new Error('Không tải được onnxruntime-web'));
          document.head.appendChild(sc);
        });
        ort.env.wasm.wasmPaths = this.ortBase;

        // Lưu model vào bộ nhớ trình duyệt (Cache Storage) — lần sau không tải lại.
        // (localStorage chỉ ~5MB và chỉ chứa chuỗi nên không đủ cho file ONNX)
        let cache = null;
        try { if (window.caches) cache = await caches.open('soluna-model-v1'); } catch (e) {}
        // Cache có hạn 1 tuần: quá hạn hoặc chưa có model thì tải lại
        const TTL = 7 * 24 * 3600 * 1000;
        let savedAt = 0;
        try { savedAt = parseInt(localStorage.getItem('soluna_model_ts') || '0', 10) || 0; } catch (e) {}
        let res = (cache && Date.now() - savedAt < TTL) ? await cache.match(this.modelUrl) : null;
        if (!res) {
          res = await fetch(this.modelUrl);
          if (!res.ok) throw new Error('Tải model lỗi ' + res.status);
          if (cache) {
            try {
              await cache.put(this.modelUrl, res.clone());
              localStorage.setItem('soluna_model_ts', String(Date.now()));
            } catch (e) {}
          }
        }
        const buf = new Uint8Array(await res.arrayBuffer());

        // Giống soluna_model: thử webgpu → webgl → wasm, nhớ backend chạy tốt lần trước, chạy thử để lộ lỗi kernel
        const n = this.size * this.size;
        this.input = new Float32Array(3 * n);
        this.tensor = new ort.Tensor('float32', this.input, [1, 3, this.size, this.size]);
        const all = ['webgpu', 'webgl', 'wasm'];
        let last = null;
        try { last = localStorage.getItem('soluna_ep'); } catch (e) {}
        const order = last && all.includes(last) ? [last, ...all.filter(x => x !== last)] : all;
        let sess = null;
        for (const ep of order) {
          let s = null;
          try {
            s = await ort.InferenceSession.create(buf, { executionProviders: [ep], graphOptimizationLevel: 'all' });
            this.inName = s.inputNames[0];
            for (let i = 0; i < 3; i++) await s.run({ [this.inName]: this.tensor });
            sess = s;
            this.backend = ep;
            try { localStorage.setItem('soluna_ep', ep); } catch (e) {}
            break;
          } catch (e) {
            try { await s?.release?.(); } catch (_) {}
          }
        }
        if (!sess) throw new Error('Không tạo được phiên ONNX');
        this.session = sess;
        this.state = 'ready';
      } catch (e) {
        console.warn('soluna model unavailable, dùng detector ảnh', e);
        this.state = 'failed';
      }
    },

    // Chạy 1 lần suy luận trên vùng đang nhìn thấy (đã zoom); kết quả lấy bằng get()
    async kick(video, zoom) {
      if (this.state !== 'ready' || this.busy) return;
      if (!video || video.readyState < 2 || !video.videoWidth) return;
      this.busy = true;
      const t0 = performance.now();
      try {
        const vw = video.videoWidth, vh = video.videoHeight;
        const zoomFactor = Math.max(1, Number.isFinite(zoom) ? zoom : 1);
        const coverScale = Math.max(window.innerWidth / vw, window.innerHeight / vh);
        const sourceW = Math.min(vw, window.innerWidth / coverScale / zoomFactor);
        const sourceH = Math.min(vh, window.innerHeight / coverScale / zoomFactor);
        const sourceX = (vw - sourceW) / 2;
        const sourceY = (vh - sourceH) / 2;

        // Letterbox giống Ultralytics (nền xám 114)
        const S = this.size;
        const sc = Math.min(S / sourceW, S / sourceH);
        const dw = sourceW * sc, dh = sourceH * sc;
        const padX = (S - dw) / 2, padY = (S - dh) / 2;
        this.ctx.fillStyle = 'rgb(114,114,114)';
        this.ctx.fillRect(0, 0, S, S);
        this.ctx.drawImage(video, sourceX, sourceY, sourceW, sourceH, padX, padY, dw, dh);
        const px = this.ctx.getImageData(0, 0, S, S).data;

        const n = S * S;
        const input = this.input;   // dùng lại bộ đệm, không cấp phát mỗi khung
        for (let i = 0; i < n; i++) {
          input[i] = px[i * 4] / 255;
          input[n + i] = px[i * 4 + 1] / 255;
          input[2 * n + i] = px[i * 4 + 2] / 255;
        }
        const out = await this.session.run({ [this.inName]: this.tensor });
        const o = out[Object.keys(out)[0]];
        const d = o.data, N = o.dims[2];

        // Mỗi lớp chỉ lấy hộp điểm cao nhất (đủ cho 1 Mặt Trời / 1 Mặt Trăng)
        const best = [null, null];
        const top = [0, 0];   // điểm cao nhất mỗi lớp (kể cả dưới ngưỡng) để debug
        // Hysteresis: đã thấy trong 1s gần đây thì chỉ cần ngưỡng thấp để giữ, tránh lúc được lúc không
        const tNow = performance.now();
        const thr = [0, 1].map(c => (this.hitTs[c] && tNow - this.hitTs[c] < 1000) ? this.holdScore : this.minScore);
        for (let i = 0; i < N; i++) {
          for (let c = 0; c < 2; c++) {
            const sco = d[(4 + c) * N + i];
            if (sco > top[c]) top[c] = sco;
            if (sco >= thr[c] && (!best[c] || sco > best[c].sco)) best[c] = { i, sco };
          }
        }
        this.info = `${(performance.now() - t0).toFixed(0)}ms ${vw}x${vh} dims[${Array.from(o.dims)}] top moon ${top[0].toFixed(2)} sun ${top[1].toFixed(2)}`;
        const build = (b) => {
          if (!b) return null;
          const cx = d[b.i], cy = d[N + b.i], bw = d[2 * N + b.i], bh = d[3 * N + b.i];
          const x = sourceX + (cx - padX) / sc;
          const y = sourceY + (cy - padY) / sc;
          const wV = bw / sc, hV = bh / sc;
          // Màu + độ sáng quanh tâm hộp (trên ảnh 320)
          const rx = Math.max(1, Math.round(Math.min(bw, bh) * 0.25));
          let sr = 0, sg = 0, sb = 0, cnt = 0, maxB = 0;
          for (let yy = Math.max(0, Math.round(cy) - rx); yy <= Math.min(S - 1, Math.round(cy) + rx); yy++) {
            for (let xx = Math.max(0, Math.round(cx) - rx); xx <= Math.min(S - 1, Math.round(cx) + rx); xx++) {
              const k = (yy * S + xx) * 4;
              sr += px[k]; sg += px[k + 1]; sb += px[k + 2]; cnt++;
              const br = (px[k] + px[k + 1] + px[k + 2]) / 3;
              if (br > maxB) maxB = br;
            }
          }
          cnt = Math.max(cnt, 1);
          return {
            x, y,
            // Model đã lọc theo minScore → quy về thang tin cậy của Fusion (≥ ngưỡng chấp nhận)
            score: b.sco,
            confidence: clamp(0.5 + b.sco * 0.5, 0, 1),
            maxB,
            areaRatio: (wV * hV) / (sourceW * sourceH),
            avgColor: { r: Math.round(sr / cnt), g: Math.round(sg / cnt), b: Math.round(sb / cnt) },
            dist: 0,
            verified: true,
            radiusPx: Math.max(6, (wV + hV) / 4),
            fromModel: true
          };
        };
        const res = [build(best[0]), build(best[1])];
        // Mất phát hiện thoáng qua (<1s) thì giữ kết quả cũ, không nhấp nháy
        for (let c = 0; c < 2; c++) {
          if (res[c]) { this.hitTs[c] = tNow; this.keep[c] = res[c]; }
          else if (this.keep[c] && tNow - this.hitTs[c] < 1000) res[c] = this.keep[c];
        }
        this.results = { moon: res[0], sun: res[1] };
        this.lastTs = performance.now();
      } catch (e) {
        this.info = 'LỖI ' + ((e && e.message) || e);
        console.warn('soluna inference', e);
      } finally {
        this.busy = false;
      }
    },

    get(kind) {
      if (this.state !== 'ready' || performance.now() - this.lastTs > 700) return null;
      return this.results[kind];
    }
  };

  // ============================================================
  //  Fusion (mỗi thiên thể một instance độc lập)
  // ============================================================
  function createFusion() {
    return {
      screenX: null,
      screenY: null,
      confidence: 0,
      source: 'none',
      sx: null,
      sy: null,
      offX: null,
      offY: null,
      lastConf: 0,
      sunRadius: null,
      detNx: null,
      detNy: null,
      lastImageTs: 0,
      imageSamples: [],
      lastSampleResult: null,
      requiredSamples: 3,
      maxSamples: 5,

      angularSunRadiusPx(canvasW) {
        const sunDeg = 0.53;
        return (sunDeg / Projection.hFovDeg) * canvasW * 0.5;
      },

      update(predNx, predNy, predInFrame, imgResult, videoW, videoH, canvasW, canvasH) {
        const now = performance.now();
        let targetX = null, targetY = null;
        let conf = 0;
        let src = 'none';
        let radiusTarget = this.angularSunRadiusPx(canvasW);
        this.detNx = null;
        this.detNy = null;

        if (!predInFrame) {
          this.confidence = 0;
          this.screenX = null;
          this.screenY = null;
          this.source = 'none';
          this.sx = null;
          this.sy = null;
          this.sunRadius = null;
          this.offX = this.offY = null;
          this.imageSamples = [];
          this.lastSampleResult = null;
          return;
        }


        // Chấp nhận detection mạnh kể cả khi lệch pred (pitch/heading offset sai).
        // Overexposed sun thường fail verified vì vòng quanh vẫn sáng → nới verified.
        const strongBlob = imgResult &&
          imgResult.confidence >= 0.50 &&
          (imgResult.radiusPx == null || imgResult.radiusPx >= 8) &&
          (imgResult.maxB == null || imgResult.maxB >= 200);
        let imgOk = imgResult &&
          imgResult.confidence >= 0.52 &&
          (imgResult.radiusPx == null || imgResult.radiusPx >= 6) &&
          (imgResult.verified === true || strongBlob);
        if (imgOk && predNx != null && predNy != null) {
          const m = this._mapVideoToDisplay(imgResult.x, imgResult.y, videoW, videoH, canvasW, canvasH);
          const dist = Math.hypot(m.x - predNx * canvasW, m.y - predNy * canvasH);
          const maxDist = Math.min(canvasW, canvasH) * (strongBlob ? 0.72 : 0.50);
          if (dist > maxDist) imgOk = false;
        }

        if (imgOk) {
          const mapped = this._mapVideoToDisplay(imgResult.x, imgResult.y, videoW, videoH, canvasW, canvasH);
          if (imgResult !== this.lastSampleResult) {
            const samples = this.imageSamples;
            const recent = samples.slice(-this.requiredSamples);
            if (recent.length) {
              const meanX = recent.reduce((sum, sample) => sum + sample.x, 0) / recent.length;
              const meanY = recent.reduce((sum, sample) => sum + sample.y, 0) / recent.length;
              const maxStep = Math.min(canvasW, canvasH) * 0.06;
              if (Math.hypot(mapped.x - meanX, mapped.y - meanY) > maxStep) {
                samples.length = 0;
              }
            }
            samples.push({ x: mapped.x, y: mapped.y });
            if (samples.length > this.maxSamples) samples.shift();
            this.lastSampleResult = imgResult;
          }

          if (this.imageSamples.length >= this.requiredSamples) {
            targetX = this.imageSamples.reduce((sum, sample) => sum + sample.x, 0) / this.imageSamples.length;
            targetY = this.imageSamples.reduce((sum, sample) => sum + sample.y, 0) / this.imageSamples.length;
            this.detNx = targetX / canvasW;
            this.detNy = targetY / canvasH;
          }
          this.lastImageTs = now;
          conf = imgResult.confidence;
          src = 'image';
          if (imgResult.radiusPx && videoW > 0) {
            const scale = Math.max(canvasW / videoW, canvasH / videoH);
            radiusTarget = clamp(imgResult.radiusPx * scale, 6, Math.min(canvasW, canvasH) * 0.18);
          }
        } else {
          this.imageSamples = [];
          this.lastSampleResult = null;
        }

        // Ổn định: lưu độ lệch (detect − dự đoán cảm biến) đã làm mượt, vị trí hiển thị = dự đoán + độ lệch.
        // Nhờ vậy overlay bám theo chuyển động mượt của cảm biến, detect chỉ hiệu chỉnh dần (không giật).
        const hasPred = predNx != null && predNy != null;
        if (targetX != null && hasPred) {
          const dx = targetX - predNx * canvasW;
          const dy = targetY - predNy * canvasH;
          if (this.offX == null) {
            this.offX = dx;
            this.offY = dy;
          } else {
            const step = Math.hypot(dx - this.offX, dy - this.offY);
            // Lệch lớn → nhảy thẳng tới vị trí đúng (overlay sẽ hiện lại từ tâm, không trượt)
            const a = step > Math.min(canvasW, canvasH) * 0.05
              ? 1 : clamp(step / (Math.min(canvasW, canvasH) * 0.03), 0.35, 0.9);
            this.offX = lerp(this.offX, dx, a);
            this.offY = lerp(this.offY, dy, a);
          }
          this.lastConf = conf;
        } else if (targetX == null && hasPred && this.offX != null && now - this.lastImageTs < 1200) {
          // Mất detect thoáng qua → giữ độ lệch cũ, không nhấp nháy
          targetX = predNx * canvasW + this.offX;
          targetY = predNy * canvasH + this.offY;
          conf = (this.lastConf || 0.3) * 0.95;
          this.lastConf = conf;
          src = 'image';
        } else if (targetX == null) {
          this.offX = this.offY = null;
        }
        if (targetX != null && hasPred && this.offX != null) {
          targetX = predNx * canvasW + this.offX;
          targetY = predNy * canvasH + this.offY;
        }

        if (targetX != null && !hasPred) this.offX = this.offY = null;
        if (targetX != null) {
          if (this.sx == null) {
            this.sx = targetX;
            this.sy = targetY;
            this.sunRadius = radiusTarget;
          } else {
            // Có dự đoán: targetX đã là dự đoán + độ lệch mượt. Không có: làm mượt trực tiếp theo model
            const a = hasPred ? 1 : 0.35;
            this.sx = lerp(this.sx, targetX, a);
            this.sy = lerp(this.sy, targetY, a);
            this.sunRadius = lerp(this.sunRadius != null ? this.sunRadius : radiusTarget, radiusTarget, 0.1);
          }
          this.screenX = this.sx;
          this.screenY = this.sy;
          this.confidence = conf;
          this.source = src;
        } else {
          this.screenX = null;
          this.screenY = null;
          this.sx = null;
          this.sy = null;
          this.sunRadius = null;
          this.confidence = 0;
          this.source = 'none';
        }
      },

      clear() {
        this.screenX = this.screenY = this.sx = this.sy = null;
        this.sunRadius = null;
        this.confidence = 0;
        this.source = 'none';
        this.detNx = this.detNy = null;
        this.offX = this.offY = null;
        this.imageSamples = [];
        this.lastSampleResult = null;
      },

      _mapVideoToDisplay(vx, vy, vw, vh, dw, dh) {
        const scale = Math.max(dw / vw, dh / vh);
        const dispW = vw * scale;
        const dispH = vh * scale;
        const offsetX = (dw - dispW) / 2;
        const offsetY = (dh - dispH) / 2;
        return { x: offsetX + vx * scale, y: offsetY + vy * scale };
      }
    };
  }

  const FusionSun = createFusion();
  const FusionMoon = createFusion();

  // ============================================================
  //  AR Overlay — Mặt Trời + Mặt Trăng (cùng ảnh, hai lớp độc lập)
  // ============================================================
  const AROverlay = {
    sunEl: null,
    moonEl: null,
    imageUrl: 'https://raw.githubusercontent.com/t-root/droply/refs/heads/main/img.png',

    init() {
      this.sunEl = document.getElementById('sun-overlay');
      this.moonEl = document.getElementById('moon-overlay');
      if (this.sunEl) this.sunEl.src = this.imageUrl;
      if (this.moonEl) this.moonEl.src = this.imageUrl;
    },

    _place(el, x, y, visible, radiusPx) {
      if (!el) return;
      if (!visible || x == null || y == null) {
        el.style.display = 'none';
        el._lx = null;
        return;
      }
      const base = Math.min(window.innerWidth, window.innerHeight);
      // Mới hiện hoặc vừa nhảy xa (lệch được sửa) → hiện lại từ tâm thay vì trượt
      const popIn = el._lx == null || Math.hypot(x - el._lx, y - el._ly) > base * 0.06;
      el._lx = x; el._ly = y;
      // Nhỏ hơn đốm sáng thật (~0.82) → viền ánh sáng Mặt Trăng lộ rõ xung quanh,
      // tạo cảm giác overlay nằm xa hơn (không đè sát / không quá gần).
      let r = radiusPx != null ? radiusPx * 0.82 : base * 0.028;
      r = clamp(r, 7, base * 0.18);
      const d = r * 2;
      el.style.display = 'block';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.width = d + 'px';
      el.style.height = d + 'px';
      el.style.opacity = '0.9';
      el.style.borderRadius = '50%';
      el.style.filter = 'brightness(1.06) contrast(0.96) saturate(0.88)';
      el.style.boxShadow = '0 0 10px 2px rgba(255, 230, 180, 0.22)';
      if (popIn && el.animate) {
        el.animate([
          { transform: 'translate(-50%, -50%) scale(0.2)', opacity: 0 },
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 0.9 }
        ], { duration: 180, easing: 'ease-out' });
      }
    },

    renderSun(x, y, visible, radiusPx) {
      this._place(this.sunEl, x, y, visible, radiusPx);
    },
    renderMoon(x, y, visible, radiusPx) {
      this._place(this.moonEl, x, y, visible, radiusPx);
    }
  };

  // ============================================================
  //  App
  // ============================================================
  const App = {
    running: false,
    debug: true,
    video: null,
    overlay: null,
    octx: null,
    stage: null,
    statusEl: null,
    debugEl: null,
    raf: 0,
    frameCount: 0,
    lastDetectFrame: 0,
    // Pinch zoom
    zoom: 1,
    minZoom: 1,
    maxZoom: 4,
    _pinchStartDist: 0,
    _pinchStartZoom: 1,

    init() {
      this.video = document.getElementById('video');
      this.overlay = document.getElementById('overlay');
      this.stage = document.getElementById('stage');
      this.octx = this.overlay.getContext('2d');
      this.statusEl = document.getElementById('status');
      this.debugEl = document.getElementById('debug');
      AROverlay.init();
      SunDetector.init();
      ModelDetector.load();
      SkyCheck.init();
      SkyCheck.enabled = true;
      SensorManager.init();

      document.getElementById('btn-grant').addEventListener('click', () => this.onGrant());
      document.getElementById('btn-manual').addEventListener('click', () => this.onManualLoc());

      this._initPinchZoom();

      window.addEventListener('resize', () => this.resize());
      this.resize();
    },

    _initPinchZoom() {
      const app = document.getElementById('app');
      const dist = (t0, t1) => Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);

      app.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          this._pinchStartDist = dist(e.touches[0], e.touches[1]);
          this._pinchStartZoom = this.zoom;
        }
      }, { passive: true });

      app.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 2 || !this._pinchStartDist) return;
        e.preventDefault();
        const d = dist(e.touches[0], e.touches[1]);
        const ratio = d / this._pinchStartDist;
        this.zoom = clamp(this._pinchStartZoom * ratio, this.minZoom, this.maxZoom);
        this._applyZoom();
      }, { passive: false });

      app.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) this._pinchStartDist = 0;
      }, { passive: true });
    },

    _applyZoom() {
      if (!this.stage) return;
      this.stage.style.transform = 'scale(' + this.zoom + ')';
    },

    resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      this.overlay.width = w;
      this.overlay.height = h;
      const sz = CameraManager.getSize();
      if (sz.w) Projection.estimateFromVideo(sz.w, sz.h);
    },

    setStatus(text, kind) {
      this.statusEl.textContent = text;
      this.statusEl.className = kind || '';
    },

    async onGrant() {
      const gate = document.getElementById('permission-gate');
      const btn = document.getElementById('btn-grant');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Đang mở…';
      }
      // iOS: requestPermission() PHẢI gọi ngay trong cú chạm, trước mọi await
      const sensorPerm = SensorManager.requestPermission();
      try {
        // Tải model trước khi mở camera (lỗi thì bỏ qua, sẽ dùng thuật toán)
        if (btn) btn.textContent = 'Đang tải model…';
        await ModelDetector.load();
        if (btn) btn.textContent = 'Đang mở…';
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Trình duyệt không hỗ trợ camera (cần HTTPS)');
        }
        await CameraManager.start(this.video);
        this.resize();

        gate.classList.add('hidden');
        this.running = true;
        this.setStatus('Đang lấy vị trí…', 'warn');
        this.startLoop();

        try {
          const granted = await sensorPerm;
          SensorManager.start();
          if (!granted) {
            this.setStatus('Chưa được cấp quyền Chuyển động & Hướng (iPhone: Cài đặt > Safari > Chuyển động & Hướng)', 'err');
          }
        } catch (se) {
          console.warn('sensor', se);
        }

        LocationTime.request().then(() => {
          this.setStatus('Đang tìm Mặt Trời / Mặt Trăng…', 'warn');
        }).catch(() => {
          document.getElementById('manual-loc').style.display = 'flex';
          gate.classList.remove('hidden');
          this.setStatus('Cần nhập tọa độ thủ công', 'warn');
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Cho phép Camera & Vị trí';
          }
        });
      } catch (e) {
        console.error(e);
        this.setStatus('Không mở được camera: ' + (e.message || e.name), 'err');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Cho phép Camera & Vị trí';
        }
        alert('Không thể mở camera.\n' + (e.message || e.name || e) +
          '\n\nHãy dùng HTTPS (GitHub Pages), cấp quyền camera, và thử lại.');
      }
    },

    onManualLoc() {
      const lat = parseFloat(document.getElementById('lat-input').value);
      const lon = parseFloat(document.getElementById('lon-input').value);
      if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        alert('Tọa độ không hợp lệ');
        return;
      }
      LocationTime.setManual(lat, lon);
      document.getElementById('permission-gate').classList.add('hidden');
      this.running = true;
      this.setStatus('Đang tìm Mặt Trời / Mặt Trăng…', 'warn');
      this.startLoop();
    },

    startLoop() {
      if (this.raf) cancelAnimationFrame(this.raf);
      const loop = () => {
        this.tick();
        this.raf = requestAnimationFrame(loop);
      };
      this.raf = requestAnimationFrame(loop);
    },

    _projectBody(body, heading, pitch) {
      if (heading == null || pitch == null || body.altitude <= -8) {
        return { dAz: null, dAlt: null, nx: null, ny: null, inFrame: false };
      }
      const dAz = ((body.azimuth - heading + 540) % 360) - 180;
      const dAlt = body.altitude - pitch;
      const proj = Projection.project(dAz, dAlt);
      const zoomHalf = 0.5 / Math.max(1, this.zoom);
      const viewMin = 0.5 - zoomHalf;
      const viewMax = 0.5 + zoomHalf;
      let inFrame = Math.abs(dAz) < 90 &&
        proj.nx >= viewMin && proj.nx <= viewMax &&
        proj.ny >= viewMin && proj.ny <= viewMax;
      if (pitch < -15 && body.altitude > 0) inFrame = false;
      return { dAz, dAlt, nx: proj.nx, ny: proj.ny, inFrame };
    },

    _recoverFromModel(body, pred, fusion, kind, heading, pitch, vSize, w, h) {
      const rec = this._rec || (this._rec = {});
      const st = rec[kind] || (rec[kind] = { last: null, n: 0, d: null });
      const img = ModelDetector.get(kind);
      // Chỉ khi thiên thể đang trên trời và dự đoán hiện tại sai rõ rệt
      const off = pred.nx == null || pred.inFrame === false ||
        Math.hypot(pred.nx - 0.5, pred.ny - 0.5) > 0.6;
      if (!img || !off || body.altitude < -2 || (img.score || 0) < 0.6 || !vSize.w) { st.n = 0; return; }
      if (img === st.last) return; // chỉ đếm kết quả mới
      st.last = img;
      const m = fusion._mapVideoToDisplay(img.x, img.y, vSize.w, vSize.h, w, h);
      const tH = Math.tan(deg2rad((Projection.screenHFovDeg || 65) / 2));
      const tV = Math.tan(deg2rad((Projection.screenVFovDeg || 50) / 2));
      const dAzDet = rad2deg(Math.atan((m.x / w - 0.5) * 2 * tH));
      const dAltDet = rad2deg(Math.atan((0.5 - m.y / h) * 2 * tV));
      const dHead = ((body.azimuth - dAzDet - heading + 540) % 360) - 180;
      const dPitch = (body.altitude - dAltDet) - pitch;
      // Cần nhiều kết quả liên tiếp cho cùng một độ lệch mới tin (tránh nhầm đèn/vật sáng khác)
      if (st.d && Math.hypot(dHead - st.d.h, dPitch - st.d.p) < 4) st.n++; else st.n = 1;
      st.d = { h: dHead, p: dPitch };
      if (st.n >= 6 && Math.abs(dPitch) < 40) {
        AutoCal._apply(dHead, dPitch);
        st.n = 0;
      }
    },

    tick() {
      this.frameCount++;
      const w = this.overlay.width;
      const h = this.overlay.height;
      this.octx.clearRect(0, 0, w, h);

      if (LocationTime.lat == null) return;

      const now = LocationTime.now();
      // Luôn tính cả hai — không phụ thuộc giờ ngày/đêm
      const sun = SunEphemeris.compute(LocationTime.lat, LocationTime.lon, now);
      const moon = MoonEphemeris.compute(LocationTime.lat, LocationTime.lon, now);

      const heading = SensorManager.sHeading;
      const pitch = SensorManager.sPitch;
      const hasSensor = SensorManager.isFresh() && heading != null && pitch != null;

      const sunPred = this._projectBody(sun, heading, pitch);
      const moonPred = this._projectBody(moon, heading, pitch);

      // SkyCheck chỉ chặn Mặt Trời khi trong nhà (ban ngày cần bầu trời)
      if (this.running) SkyCheck.update(this.video);
      const indoor = SkyCheck.enabled && SkyCheck.outdoor === false;
      let sunInFrame = sunPred.inFrame;
      let moonInFrame = moonPred.inFrame;
      // Trong nhà: Mặt Trời gần như chắc bị khuất; Mặt Trăng qua cửa sổ vẫn có thể thấy
      if (indoor) sunInFrame = false;

      const vSize = CameraManager.getSize();
      let sunImg = null, moonImg = null;

      // Model chạy bất đồng bộ, mỗi khung 1 lần (kick tự bỏ qua khi đang bận)
      if (this.running) ModelDetector.kick(this.video, this.zoom);
      if (this.running && this.frameCount - this.lastDetectFrame >= 2) {
        this.lastDetectFrame = this.frameCount;
        // Chỉ nhận khi thiên thể nằm đúng hướng dự đoán (tránh nhầm với vật sáng khác).
        // Model ưu tiên; thuật toán (detector ảnh) chỉ dùng khi model chưa tải xong hoặc lỗi
        if (sunInFrame) {
          sunImg = ModelDetector.get('sun');
          if (!sunImg && ModelDetector.state !== 'ready') {
            SunDetector.moon = false;
            sunImg = SunDetector.detect(this.video, sunPred.nx, sunPred.ny, this.zoom);
          }
          this._lastSunImg = sunImg;
        } else {
          this._lastSunImg = null;
        }
        if (moonInFrame) {
          moonImg = ModelDetector.get('moon');
          if (!moonImg && ModelDetector.state !== 'ready') {
            SunDetector.moon = true;
            moonImg = SunDetector.detect(this.video, moonPred.nx, moonPred.ny, this.zoom);
          }
          this._lastMoonImg = moonImg;
        } else {
          this._lastMoonImg = null;
        }
      } else {
        sunImg = sunInFrame ? this._lastSunImg : null;
        moonImg = moonInFrame ? this._lastMoonImg : null;
      }

      if (this.running) {
        FusionSun.update(sunPred.nx, sunPred.ny, sunInFrame, sunImg, vSize.w, vSize.h, w, h);
        FusionMoon.update(moonPred.nx, moonPred.ny, moonInFrame, moonImg, vSize.w, vSize.h, w, h);
      } else {
        FusionSun.clear();
        FusionMoon.clear();
      }

      // La bàn lệch nhiều (>~30°) thì thiên thể bị dự đoán nằm ngoài khung nên không được nhận,
      // AutoCal cũng bỏ qua (err > 0.42) → kẹt mãi. Khi model thấy rõ vật thể mà vị trí thiên văn
      // khẳng định nó đang trên trời, hiệu chỉnh thẳng heading/pitch theo vị trí model thấy.
      if (this.running && hasSensor && ModelDetector.state === 'ready') {
        this._recoverFromModel(sun, sunPred, FusionSun, 'sun', heading, pitch, vSize, w, h);
        this._recoverFromModel(moon, moonPred, FusionMoon, 'moon', heading, pitch, vSize, w, h);
      }

      // Tự hiệu chỉnh theo thiên thể đang bám (kể cả blob overexposed chưa pass verified)
      // (chỉ khi thiên thể đúng hướng dự đoán, tránh lệch offset khi model thấy vật ngoài hướng)
      const calSrc = (sunInFrame && FusionSun.source === 'image' && sunImg && sunImg.confidence >= 0.52 && FusionSun.detNx != null)
        ? { f: FusionSun, p: sunPred, img: sunImg }
        : (moonInFrame && FusionMoon.source === 'image' && moonImg && moonImg.confidence >= 0.52 && FusionMoon.detNx != null)
          ? { f: FusionMoon, p: moonPred, img: moonImg }
          : null;
      if (calSrc && calSrc.f.detNx != null && calSrc.p.nx != null) {
        AutoCal.feed(calSrc.f.detNx, calSrc.f.detNy, calSrc.p.nx, calSrc.p.ny);
      } else {
        AutoCal.streak = 0;
      }

      const sunShow = this.running && FusionSun.source === 'image' && FusionSun.screenX != null && FusionSun.confidence > 0.28;
      const moonShow = this.running && FusionMoon.source === 'image' && FusionMoon.screenX != null && FusionMoon.confidence > 0.28;
      AROverlay.renderSun(FusionSun.screenX, FusionSun.screenY, sunShow, FusionSun.sunRadius);
      AROverlay.renderMoon(FusionMoon.screenX, FusionMoon.screenY, moonShow, FusionMoon.sunRadius);

      // True/false: thiên thể đang trên chân trời (Alt > 0)
      const sunUp = sun.altitude > 0;
      const moonUp = moon.altitude > 0;
      const flagsEl = document.getElementById('body-flags');
      if (flagsEl) {
        flagsEl.textContent = 'Sun: ' + (sunUp ? 'true' : 'false') + ' · Moon: ' + (moonUp ? 'true' : 'false');
        flagsEl.style.color = (sunUp || moonUp) ? '#a3e635' : '#94a3b8';
      }

      // Status
      if (!this.running) {
        // leave
      } else if (sunShow || moonShow) {
        this.setStatus('Đã nhận diện (' + (ModelDetector.state === 'ready' ? 'model · ' + ModelDetector.backend : 'thuật toán') + ')', 'ok');
      } else if (!hasSensor || (!sunInFrame && !moonInFrame)) {
        // không set status (đã bỏ "Bạn chưa quay về hướng")
      } else {
        this.setStatus('Không tìm thấy...', 'warn');
      }

      // Mũi tên chỉ hướng: hiện cho mọi thiên thể đang trên trời nhưng chưa nhận diện được
      // → có thể hiện cả 2 mũi tên cùng lúc (vàng = Mặt Trời, trắng sữa = Mặt Trăng)
      let sunArrowAngle = null;
      let moonArrowAngle = null;
      if (this.running && hasSensor) {
        if (!sunShow && sunPred.dAz != null) {
          sunArrowAngle = rad2deg(Math.atan2(sunPred.dAz, sunPred.dAlt));
        }
        if (!moonShow && moonPred.dAz != null) {
          moonArrowAngle = rad2deg(Math.atan2(moonPred.dAz, moonPred.dAlt));
        }
      }

      const placeArrow = (el, angle) => {
        if (!el) return;
        if (angle == null) {
          el.style.display = 'none';
        } else {
          el.style.display = 'block';
          // > mặc định hướng phải; xoay để chỉ hướng thiên thể
          el.style.transform = 'rotate(' + (angle - 90).toFixed(1) + 'deg)';
        }
      };
      placeArrow(document.getElementById('dir-arrow-sun'), sunArrowAngle);
      placeArrow(document.getElementById('dir-arrow-moon'), moonArrowAngle);

      if (this.debug) {
        this.drawDebug(w, h, sun, moon, heading, pitch, sunPred, moonPred, sunImg, moonImg, hasSensor, sunInFrame, moonInFrame);
      }
    },

    drawDebug(w, h, sun, moon, heading, pitch, sunPred, moonPred, sunImg, moonImg, hasSensor, sunIn, moonIn) {
      const fmt = (img) => img ? `c=${img.confidence.toFixed(2)} r=${img.radiusPx|0}${img.verified ? ' v' : ''}${img.fromModel ? ' M' : ''}` : '—';
      const lines = [
        `Lat ${LocationTime.lat?.toFixed(4)}  Lon ${LocationTime.lon?.toFixed(4)}  (${LocationTime.source})`,
        `Sun: ${sun.altitude > 0}  Moon: ${moon.altitude > 0}`,
        `Sun  Az ${sun.azimuth.toFixed(1)}° Alt ${sun.altitude.toFixed(1)}°  in=${sunIn}  img:${fmt(sunImg)}  F:${FusionSun.source}`,
        `Moon Az ${moon.azimuth.toFixed(1)}° Alt ${moon.altitude.toFixed(1)}°  in=${moonIn}  img:${fmt(moonImg)}  F:${FusionMoon.source}`,
        `Head ${heading != null ? heading.toFixed(1) : '—'}° (off ${SensorManager.headingOffset.toFixed(1)}°)  Pitch ${pitch != null ? pitch.toFixed(1) : '—'}°`,
        `Sun  dAz ${sunPred.dAz != null ? sunPred.dAz.toFixed(1) : '—'}° dAlt ${sunPred.dAlt != null ? sunPred.dAlt.toFixed(1) : '—'}°  pred(${sunPred.nx != null ? sunPred.nx.toFixed(2) : '—'},${sunPred.ny != null ? sunPred.ny.toFixed(2) : '—'})`,
        `Moon dAz ${moonPred.dAz != null ? moonPred.dAz.toFixed(1) : '—'}° dAlt ${moonPred.dAlt != null ? moonPred.dAlt.toFixed(1) : '—'}°  pred(${moonPred.nx != null ? moonPred.nx.toFixed(2) : '—'},${moonPred.ny != null ? moonPred.ny.toFixed(2) : '—'})`,
        `β=${SensorManager.beta != null ? SensorManager.beta.toFixed(1) : '—'} γ=${SensorManager.gamma != null ? SensorManager.gamma.toFixed(1) : '—'} fresh:${hasSensor}  zoom:${this.zoom.toFixed(2)}x  model:${ModelDetector.state}${ModelDetector.backend ? '/' + ModelDetector.backend : ''}`,
        `AI ${ModelDetector.info || '—'}`
      ];
      this.debugEl.textContent = lines.join('\n');
    }
  };

  document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
</body>
</html>
